version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. Storage & FinOps State (Redis 7)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 2. Hybrid Vector Search (Qdrant)
  # -------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: enterprise-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. Headless Semantic Layer (Cube Core)
  # -------------------------------------------------------------
  cube:
    image: cubejs/cube:v0.35
    container_name: enterprise-cube
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./cube:/cube/conf
      - ./data:/cube/data
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_DB_TYPE=duckdb
      - CUBEJS_DB_DUCKDB_DATABASE=/cube/data/lakehouse/gold/lakehouse.duckdb
      - CUBEJS_API_SECRET=enterprise_super_secret_cube_token_2026
    depends_on:
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. Central Orchestrator & Security Gateway (FastAPI)
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: enterprise-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - LLM_PROVIDER=mock
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - CUBE_API_URL=http://cube:4000/cubejs-api/v1
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # -------------------------------------------------------------
  # 5. Enterprise AI Portal (Streamlit)
  # -------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: enterprise-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  redis_data:
  qdrant_data:
